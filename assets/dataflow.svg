<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc"><title id="title">rSEARCH architecture and dataflow</title><desc id="desc">A brief enters the CLI or skill or the desktop MCP server. Native Codex or Claude produce recorded search events and structured findings. Two completed retrieval operations are required. Failed runs stop. A verifier assigns evidence levels and produces Markdown and JSON dossiers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007991"/></marker></defs><rect width="1800" height="1080" fill="#F5F4EE"/><g font-family="Segoe UI,Arial,sans-serif" fill="#152E36">
